# Alpha Factory Configuration
# Values here override built-in defaults via deep merge in load_settings().

brain:
  # Base URL for WorldQuant BRAIN REST API
  api_url: "https://api.worldquantbrain.com"
  # HTTP connection and read timeouts (seconds)
  connect_timeout_s: 10
  read_timeout_s: 60
  # Local paths for cached session cookies and BRAIN credentials
  session_cache_path: "~/secrets/alpha-factory-session.json"
  credentials_path: "~/secrets/platform-brain.json"
  # Proactively re-authenticate when remaining session TTL falls below threshold (seconds)
  relogin_ttl_threshold_s: 1800
  # Biometric / 2FA polling interval and maximum wait duration (seconds)
  biometric_poll_interval_s: 15
  biometric_max_wait_s: 1800

polling:
  # Maximum total wait time for simulation futures (seconds)
  max_wait_s: 3600
  # Maximum wait time for recordset/correlation endpoints (seconds)
  recordset_max_wait_s: 600
  # Default fallback polling interval when Retry-After header is absent (seconds)
  default_interval_s: 5
  # Maximum transient HTTP retries per request
  max_http_retries: 3

storage:
  # SQLite database file path
  db_path: "alpha_factory/data/alpha_factory.db"
  # Directory for cached daily PnL series
  pnl_dir: "alpha_factory/data/pnl"
  # Directory for automated database backups
  backup_dir: "alpha_factory/data/backups"

