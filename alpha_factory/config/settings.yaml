execution:
  # Maximum concurrent BRAIN simulation slots
  max_slots: 3
  # Maximum expressions per multi-simulation batch
  multi_sim_limit: 10
  # Daily simulation quota cap and soft warning threshold
  daily_sim_limit: 5000
  warning_threshold: 4000
  # Spread submissions evenly across the hour when enabled
  hourly_pacing: true
  # Consecutive regional failures before tripping circuit breaker
  circuit_breaker_threshold: 3
  # Cooldown duration after a region circuit breaker trips (seconds)
  region_cooldown_s: 1800
  # Default BRAIN simulation settings applied to generated candidates
  default_settings:
    alpha_type: "REGULAR"
    delay: 1
    decay: 4
    neutralization: "INDUSTRY"
    truncation: 0.08
    pasteurization: "ON"
    unit_handling: "VERIFY"
    nan_handling: "OFF"
    max_trade: "OFF"
    test_period: "P2Y0M0D"
    visualization: false

generation:
  # Queue watermarks controlling generator refill cycles
  queue_low_watermark: 100
  queue_high_watermark: 500
  # Candidate generation source mix (should sum to 1.0)
  mix:
    template: 0.40
    algorithmic_llm: 0.35
    evolution: 0.25
  # Diversity caps per AST structure and dataset-structure pair
  max_per_structure: 3
  max_per_dataset_structure: 2
  # Standard rolling lookback windows (trading days)
  lookback_days:
    - 5
    - 10
    - 20
    - 60
    - 120
  llm:
    backend: "ollama"
    base_url: "http://localhost:11434"
    models:
      - "deepseek-r1:8b"
      - "qwen2.5-coder:7b"
      - "deepseek-r1:1.5b"
      - "llama3:3b"
      - "phi3:mini"
    api_base_url: ""
    api_model: ""
    timeout_s: 45

qualification:
  # Gate 1 performance thresholds
  min_sharpe: 1.58
  min_fitness: 1.0
  min_turnover: 0.01
  max_turnover: 0.70
  min_margin: 0.0008
  # Sanity upper bounds to flag suspicious/overfit backtests
  max_sanity_sharpe: 6.0
  max_sanity_returns: 0.50
  # Gate 2 correlation ceilings
  max_self_corr: 0.70
  max_prod_corr: 0.70
  check_power_pool: false
  max_power_pool_corr: 0.50
  # Flatline detection over recent tail trading days
  flatline_zero_ratio_max: 0.30
  flatline_tail_days: 252
  # Tag qualified alphas on BRAIN platform
  tag_on_brain: true

dedup:
  # Local PnL correlation threshold for vault deduplication
  local_corr_threshold: 0.65
  min_overlap_days: 120
  trailing_window_days: 504
  # Minimum score margin required to replace an existing vault peer
  replacement_hysteresis: 0.05

submission:
  auto_submit: false
  max_submissions_per_day: 2

ops:
  log_dir: "alpha_factory/data/logs"
  shutdown_drain_timeout_s: 300
  watchdog_extra_s: 60
  telegram_enabled: false
