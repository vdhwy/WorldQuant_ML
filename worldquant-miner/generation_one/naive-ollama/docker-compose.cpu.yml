services:
  # Official Ollama CPU-only image
  ollama:
    image: ollama/ollama:latest
    container_name: naive-ollama-cpu-server
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - naive-ollma-network

  naive-ollma:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: naive-ollma-cpu
    volumes:
      - ./credential.txt:/app/credential.txt:ro
      - ./results:/app/results
      - ./logs:/app/logs
      - .:/app
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: '4.0'
    restart: unless-stopped
    command: ["python", "alpha_orchestrator.py", "--mode", "continuous", "--ollama-url", "http://ollama:11434", "--batch-size", "2", "--max-concurrent", "2"]
    depends_on:
      - ollama
    networks:
      - naive-ollma-network

  # Optional: Add a simple web interface for monitoring
  ollama-webui:
    image: ghcr.io/ollama-webui/ollama-webui:main
    container_name: ollama-webui-cpu
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_API_BASE_URL=http://ollama:11434/api
    depends_on:
      - ollama
      - naive-ollma
    restart: unless-stopped
    networks:
      - naive-ollma-network
      
  # Machine Miner Service
  machine-miner:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: machine-miner-cpu
    volumes:
      - ./credential.txt:/app/credential.txt:ro
      - ./results:/app/results
      - ./logs:/app/logs
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '2.0'
    restart: unless-stopped
    command: ["python", "machine_miner.py", "--credentials", "/app/credential.txt", "--region", "USA", "--universe", "TOP3000"]
    depends_on:
      - naive-ollma
    networks:
      - naive-ollma-network

  # Alpha Generator Dashboard
  alpha-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: alpha-dashboard-cpu
    ports:
      - "5050:5000"
    volumes:
      - ./results:/app/results
      - ./logs:/app/logs
      - ./credential.txt:/app/credential.txt:ro
      - .:/app
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    command: ["python", "web_dashboard.py"]
    depends_on:
      - naive-ollma
    restart: unless-stopped
    networks:
      - naive-ollma-network

volumes:
  ollama_data:
    driver: local

networks:
  naive-ollma-network:
    driver: bridge
